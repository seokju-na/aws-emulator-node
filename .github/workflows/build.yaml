name: build
on:
  workflow_call:
    inputs:
      upload:
        description: Upload each binding as a `binding-<triple>` artifact.
        type: boolean
        default: false
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  SEOKJU_NA_AWS_EMULATOR_NODE_SKIP_DOWNLOAD: '1'
  EMULATOR_TELEMETRY: 'off'
jobs:
  build:
    name: ${{ matrix.triple }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { triple: darwin-arm64, target: aarch64-apple-darwin, os: macos-26 }
          # --use-napi-cross links against glibc 2.17, so the binary loads on Amazon Linux 2,
          - { triple: linux-x64-gnu, target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, flags: --use-napi-cross }
          - { triple: linux-arm64-gnu, target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, flags: --use-napi-cross }
          # musl builds go through cargo-zigbuild (-x) and are tested in an Alpine container.
          - { triple: linux-x64-musl, target: x86_64-unknown-linux-musl, os: ubuntu-24.04, flags: -x, alpine: true }
          - { triple: linux-arm64-musl, target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, flags: -x, alpine: true }
    runs-on: ${{ matrix.os }}
    # The first build compiles ~440 service crates.
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      # The release build needs tens of GB; hosted Linux runners start with ~14 GB free.
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: corepack enable
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install zig (musl)
        if: matrix.alpine
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
      - run: yarn install --immutable
      - name: Build native binding
        run: yarn build:native --target ${{ matrix.target }} ${{ matrix.flags }}
        env:
          # The --use-napi-cross toolchain (glibc 2.17) ships an old GCC. It defaults to gnu89, which
          # QuickJS (rquickjs-sys) does not compile under, and on aarch64 it does not define
          # __ARM_ARCH, which ring's assembly requires.
          CFLAGS_x86_64_unknown_linux_gnu: -std=gnu11
          CFLAGS_aarch64_unknown_linux_gnu: -std=gnu11 -D__ARM_ARCH=8
      - run: yarn build:js
      - name: Test
        if: ${{ !matrix.alpine }}
        run: yarn test
      # node_modules is reinstalled inside the container: vitest's own native bindings must be
      # the musl ones.
      - name: Test (Alpine)
        if: matrix.alpine
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e SEOKJU_NA_AWS_EMULATOR_NODE_SKIP_DOWNLOAD -e EMULATOR_TELEMETRY \
            node:24-alpine \
            sh -c 'corepack enable && yarn install --immutable && yarn test'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.upload
        with:
          name: binding-${{ matrix.triple }}
          path: lib/aws-emulator-node.${{ matrix.triple }}.node
          if-no-files-found: error
          compression-level: 6
